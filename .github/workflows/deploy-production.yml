name: Deploy production

# Production deploys go through this workflow so the database credentials live
# in GitHub (Settings -> Secrets and variables -> Actions -> Repository secrets)
# instead of the Vercel dashboard. vercel.json turns off Vercel's
# own auto-deploy for main so each push is deployed exactly once.
#
# Required secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (Vercel account/project)
#   DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL   (Supabase pooler)
#   VITE_LAYERSWAP_API_KEY_MAINNET, VITE_WALLETCONNECT_PROJECT_ID   (build-time, baked into the client bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Vercel builds remotely. --build-env sets the VITE_* values Vite inlines
      # into the client bundle; --env sets the run-time variables the server-side
      # database connection reads.
      - name: Deploy to Vercel
        run: >
          npx vercel@latest deploy --prod --yes
          --token "${{ secrets.VERCEL_TOKEN }}"
          --build-env "VITE_LAYERSWAP_API_KEY_MAINNET=${{ secrets.VITE_LAYERSWAP_API_KEY_MAINNET }}"
          --build-env "VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}"
          --env "DB_HOST=${{ secrets.DB_HOST }}"
          --env "DB_PORT=${{ secrets.DB_PORT }}"
          --env "DB_USER=${{ secrets.DB_USER }}"
          --env "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
          --env "DB_NAME=${{ secrets.DB_NAME }}"
          --env "DB_SSL=${{ secrets.DB_SSL }}"
          | tee deploy-url.txt

      # The *.vercel.app deployment URL sits behind Vercel Authentication, so the
      # check goes through the public production domain instead.
      - name: Smoke test database connection
        run: |
          echo "Deployed: $(tail -n1 deploy-url.txt)"
          # Retry a few times: the first request after a deploy can hit a cold
          # database connection and return a transient 500.
          curl --fail --silent --show-error             --retry 5 --retry-delay 10 --retry-all-errors             "https://${PRODUCTION_DOMAIN}/api/test-db"
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN || 'app.yieldstark.xyz' }}
